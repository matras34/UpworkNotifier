version: '3.8'

services:
  postgres:
    image: postgres:14-alpine
    container_name: webssh-postgres
    environment:
      POSTGRES_DB: webssh
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - webssh-network

  redis:
    image: redis:7-alpine
    container_name: webssh-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - webssh-network

  backend:
    build:
      context: ./backend-python
      dockerfile: Dockerfile
    container_name: webssh-backend
    environment:
      - HOST=0.0.0.0
      - PORT=5000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=webssh
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SECRET_KEY=your-secret-key-change-in-production
      - JWT_SECRET_KEY=your-jwt-secret-change-in-production
      - ENCRYPTION_KEY=your-32-char-encryption-key-here!!
      - CORS_ORIGINS=http://localhost:3000,http://localhost
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - webssh-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: webssh-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - webssh-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  webssh-network:
    driver: bridge
